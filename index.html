<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // This compiled app expects its entry route at "/" and images/data at "/assets/".
    // GitHub Pages serves it under "/map-test/", with all assets in that folder.
    // Apply both fixes while loading index.js, without changing that original bundle.
    const scriptUrl = new URL('./index.js', document.baseURI);
    const response = await fetch(scriptUrl);
    if (!response.ok) throw new Error(`Unable to load index.js (HTTP ${response.status})`);

    let source = await response.text();
    source = source.replaceAll('/assets/', './');

    const basePath = location.pathname.startsWith('/map-test/') ? '/map-test/' : '/';
    const originalRoute = 'path:"/",component:vU';
    if (!source.includes(originalRoute)) {
      throw new Error('Could not locate the app home route in index.js');
    }
    source = source.replace(originalRoute, `path:"${basePath}",component:vU`);

    const moduleUrl = URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
    try {
      await import(moduleUrl);
    } finally {
      URL.revokeObjectURL(moduleUrl);
    }
  </script>
</body>
</html>
